<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1822 — Major Company Cards</title>
<style>
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #20201d; }
  .page { box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; }
  .heading { color: #f2ead9; font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: 900px; }
  .card { border-radius: 8px; overflow: hidden; background: #fff;
          box-shadow: 0 2px 6px rgba(0,0,0,0.4); border: 1px solid rgba(0,0,0,0.25); }
  .card-header { color: #fff; font-size: 15px; font-weight: 700; padding: 8px 12px; }
  .card-sub { display: flex; gap: 14px; padding: 6px 12px; font-size: 10px; color: #333;
              border-bottom: 1px solid #ddd; }
  .card-sub b { color: #111; }
  .card-body { display: flex; }
  .col { flex: 1; padding: 8px 12px; font-size: 10px; color: #222; }
  .col + .col { border-left: 1px solid #eee; }
  .col-title { font-weight: 700; font-size: 11px; margin-bottom: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 9px; }
  th, td { border: 1px solid #ccc; padding: 2px 4px; text-align: center; }
  th { background: #f0f0ec; }
  ul { margin: 4px 0 0 0; padding-left: 14px; }
  li { margin-bottom: 1px; }
</style>
</head>
<body>
<div class="page">
  <div class="heading">1822 &mdash; Major Companies</div>
  <div class="grid" id="grid"></div>
</div>
<script>
// Names/home/destination/color match backend/app/data/major_companies.py and
// the photographed cards in major_company.webp. Trains/Treasury table is the
// same phase-progression table printed on all ten physical cards.
const companies = [
  { abbr: 'LNWR', name: 'London and North West Railway', home: 'London (N) & Manchester', dest: 'Manchester', color: '#1c1c1c' },
  { abbr: 'MR', name: 'Midland Railway', home: 'Derby', dest: 'York', color: '#b5342a' },
  { abbr: 'LBSCR', name: 'London, Brighton and South Coast Rwy.', home: 'London (S)', dest: 'Brighton', color: '#d9b520' },
  { abbr: 'SECR', name: 'South Eastern and Chatham Railway', home: 'London (SE)', dest: 'Dover', color: '#c56a2e' },
  { abbr: 'NER', name: 'North Eastern Railway', home: 'York', dest: 'Edinburgh', color: '#7ea34a' },
  { abbr: 'GWR', name: 'Great Western Railway', home: 'London (SW)', dest: 'Bristol', color: '#2e6b3e' },
  { abbr: 'CR', name: 'Caledonian Railway', home: 'Glasgow', dest: 'Carlisle', color: '#2c4a7c' },
  { abbr: 'L&YR', name: 'Lancashire and Yorkshire Railway', home: 'Liverpool', dest: 'Manchester', color: '#5c3a6a' },
  { abbr: 'NBR', name: 'North British Railway', home: 'Edinburgh', dest: 'Aberdeen', color: '#7a5230' },
  { abbr: 'SWR', name: 'South Wales Railway', home: 'Gloucester', dest: 'Fishguard', color: '#6a6a6a' },
];

// Phase progression table, identical across all 10 major company cards
// (source: major_company.webp).
const phaseRows = [
  ['1/L', '2-', '£60', '-', 'Upgradable to 2 for £80. Majors from concession only (incremental capitalization), 1 yellow tile only.'],
  ['2', '2/4', '£120', '-', ''],
  ['3', '1/3', '£200', 'L', ''],
  ['4', '1/3', '£300', '2', ''],
  ['5', '1/2', '£500', '3', 'Remove concessions. Float on 50% sold.'],
  ['6', '1/2', '£600', '3', 'Float on 50% sold, 100% capitalisation.'],
  ['7', '1/2', '£750/£1000', '4', ''],
];

const grid = document.getElementById('grid');
for (const c of companies) {
  const rows = phaseRows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
  grid.insertAdjacentHTML('beforeend', `
    <div class="card" data-id="${c.abbr.replace(/&/g, '')}">
      <div class="card-header" style="background:${c.color}">${c.name} (${c.abbr})</div>
      <div class="card-sub">
        <span>Home: <b>${c.home}</b></span>
        <span>Destination: <b>${c.dest}</b></span>
      </div>
      <div class="card-body">
        <div class="col">
          <div class="col-title">Trains</div>
          <table>
            <tr><th>Phase</th><th>Limit</th><th>Cost</th><th>Rust</th></tr>
            ${rows}
          </table>
        </div>
        <div class="col">
          <div class="col-title">Operating Round Actions</div>
          <ul>
            <li>Perform first turn housekeeping</li>
            <li>Acquire private companies</li>
            <li>Lay or upgrade track</li>
            <li>Check for connection to destination</li>
            <li>Place one station marker</li>
            <li>Run trains</li>
            <li>Pay, split, or withhold dividends</li>
            <li>Buy rolling stock</li>
            <li>Acquire a minor company</li>
            <li>Issue or redeem shares</li>
          </ul>
        </div>
      </div>
    </div>
  `);
}
</script>
</body>
</html>
